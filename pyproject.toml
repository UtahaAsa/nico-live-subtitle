[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-live-subtitle"
version = "0.1.0"
description = "Windows system-audio Japanese subtitles with Chinese translation overlay"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["subtitle", "whisper", "japanese", "translation", "wasapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PySide6>=6.7,<7",
    "SoundCard>=0.4.3,<0.5",
    "numpy>=1.26,<3",
    "faster-whisper>=1.1,<2",
    "deep-translator>=1.11,<2",
]

[project.optional-dependencies]
local-translate = ["argostranslate>=1.9,<2"]
test = ["pytest>=8,<9"]

[project.scripts]
nico-live-subtitle = "nico_live_subtitle.__main__:main"

[project.urls]
Homepage = "https://github.com/UtahaAsa/nico-live-subtitle"
Issues = "https://github.com/UtahaAsa/nico-live-subtitle/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
